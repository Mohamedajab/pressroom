name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pressroom
          POSTGRES_USER: pressroom
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pressroom -d pressroom"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pressroom:ci-only@localhost:5432/pressroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
      - run: pytest --cov=publishing --cov-report=term-missing --cov-fail-under=85
      - name: Check production security configuration
        env:
          DEBUG: "false"
          SECRET_KEY: "ci-only-security-check-key-with-at-least-fifty-characters-do-not-deploy"
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pressroom:ci .
