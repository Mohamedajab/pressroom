services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pressroom
      POSTGRES_USER: pressroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressroom -d pressroom"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    image: pressroom:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pressroom:${POSTGRES_PASSWORD}@db:5432/pressroom
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
  web:
    image: pressroom:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pressroom:${POSTGRES_PASSWORD}@db:5432/pressroom
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  scheduler:
    image: pressroom:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pressroom:${POSTGRES_PASSWORD}@db:5432/pressroom
    command: ["sh", "-c", "while true; do python manage.py publish_due; sleep 30 & wait $$!; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
