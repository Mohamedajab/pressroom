{% if items.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if items.has_previous %}
      <a href="?page={{ items.previous_page_number }}&amp;q={{ term|urlencode }}&amp;status={{ selected_status|urlencode }}">← Previous</a>
    {% endif %}
    <span>{{ items.number }} / {{ items.paginator.num_pages }}</span>
    {% if items.has_next %}
      <a href="?page={{ items.next_page_number }}&amp;q={{ term|urlencode }}&amp;status={{ selected_status|urlencode }}">Next →</a>
    {% endif %}
  </nav>
{% endif %}
