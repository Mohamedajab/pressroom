services:
  - type: web
    name: pressroom-demo
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python scripts/start_hosted.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "false"
      - key: DEMO_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY_SEED
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pressroom-demo-db
          property: connectionString
databases:
  - name: pressroom-demo-db
    plan: free
    databaseName: pressroom
    user: pressroom
